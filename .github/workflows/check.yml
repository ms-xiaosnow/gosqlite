name: ordinary-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ordinary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: ./scripts/check.sh
# Restricted crash/fault/process-exit tests are not part of this workflow.
